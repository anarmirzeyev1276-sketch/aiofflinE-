<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>aiofflinE</title>
<style>
:root{--bg:#0d0f0e;--card:#171a19;--g:#2dff8a;--t:#e8fff1;--m:#7c8f84;--l:#22302a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{padding:10px 12px;border-bottom:1px solid var(--l)}
h1{font-size:18px;margin:0 0 8px;color:var(--g)}
#models{display:flex;flex-wrap:wrap;gap:8px;max-height:34vh;overflow-y:auto}
.m{flex:1 1 140px;background:var(--card);border:1px solid var(--l);border-radius:12px;padding:8px 10px;font-size:13px}
.m.on{border-color:var(--g);box-shadow:0 0 8px #2dff8a55}
.m small{display:block;color:var(--m);margin-top:2px}
.bar{height:4px;background:var(--l);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g)}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:82%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.u{align-self:flex-start;background:#223029}
.a{align-self:flex-end;background:#12301f;border:1px solid #1d5a38}
.e{align-self:center;background:#3a1414;border:1px solid #a33;color:#ffb4b4;text-align:center}
form{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--l)}
input{flex:1;min-width:0;background:var(--card);border:1px solid var(--l);border-radius:20px;color:var(--t);padding:10px 14px;font-size:15px;outline:none}
button{background:var(--g);color:#04130a;border:0;border-radius:20px;padding:0 18px;font-weight:700}
</style></head>
<body>
<header><h1>aiofflinE</h1><div id="models"></div></header>
<div id="chat"></div>
<form><input placeholder="Yaz..." autocomplete="off"><button>Göndər</button></form>
<script type="module">
import {Wllama} from './wllama/index.js';
const HF='https://huggingface.co/';
const MODELS=[
 {id:'gemma3',name:'Gemma 3 1B (Gemini)',size:'~0.8 GB',url:HF+'unsloth/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf'},
 {id:'gemma2',name:'Gemma 2 2B (Gemini)',size:'~1.6 GB',url:HF+'bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf'},
 {id:'deepseek',name:'DeepSeek R1 1.5B',size:'~1.1 GB',url:HF+'bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf'},
 {id:'qwen05',name:'Qwen 2.5 0.5B',size:'~0.4 GB',url:HF+'Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf'},
 {id:'qwen15',name:'Qwen 2.5 1.5B',size:'~1.1 GB',url:HF+'Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf'},
 {id:'qwencoder',name:'Qwen 2.5 Coder 0.5B',size:'~0.4 GB',url:HF+'Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf'},
 {id:'llama',name:'Llama 3.2 1B',size:'~0.8 GB',url:HF+'bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf'},
 {id:'smollm2',name:'SmolLM2 1.7B',size:'~1.1 GB',url:HF+'bartowski/SmolLM2-1.7B-Instruct-GGUF/resolve/main/SmolLM2-1.7B-Instruct-Q4_K_M.gguf'}
 ,{id:'gr1',name:'IBM Granite 3.1 1B-A400M',size:'~0.8 GB',url:HF+'bartowski/granite-3.1-1b-a400m-instruct-GGUF/resolve/main/granite-3.1-1b-a400m-instruct-Q4_K_M.gguf'}
 ,{id:'gr2',name:'IBM Granite 3.1 2B',size:'~1.6 GB',url:HF+'bartowski/granite-3.1-2b-instruct-GGUF/resolve/main/granite-3.1-2b-instruct-Q4_K_M.gguf'}
 ,{id:'gr3',name:'IBM Granite 3.1 3B-A800M',size:'~2 GB',url:HF+'bartowski/granite-3.1-3b-a800m-instruct-GGUF/resolve/main/granite-3.1-3b-a800m-instruct-Q4_K_M.gguf'}
 ,{id:'gr4',name:'IBM Granite 3.0 2B',size:'~1.6 GB',url:HF+'bartowski/granite-3.0-2b-instruct-GGUF/resolve/main/granite-3.0-2b-instruct-Q4_K_M.gguf'}
 ,{id:'phi35',name:'Microsoft Phi-3.5 mini',size:'~2.4 GB',url:HF+'bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf'}
 ,{id:'phi3',name:'Microsoft Phi-3 mini 4k',size:'~2.2 GB',url:HF+'microsoft/Phi-3-mini-4k-instruct-gguf/resolve/main/Phi-3-mini-4k-instruct-q4.gguf'}
 ,{id:'phi31',name:'Microsoft Phi-3.1 mini 128k',size:'~2.4 GB',url:HF+'bartowski/Phi-3.1-mini-128k-instruct-GGUF/resolve/main/Phi-3.1-mini-128k-instruct-Q4_K_M.gguf'}
 ,{id:'phi4',name:'Microsoft Phi-4 mini',size:'~2.5 GB',url:HF+'bartowski/microsoft_Phi-4-mini-instruct-GGUF/resolve/main/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf'}
];
const CFG={'single-thread/wllama.wasm':'./wllama/single-thread/wllama.wasm','multi-thread/wllama.wasm':'./wllama/multi-thread/wllama.wasm'};
const ERR='AI not Download,,and not wifi have!';
const $=s=>document.querySelector(s), chat=$('#chat'), box=$('#models');
let w=null,cur=null,busy=false,loadingId=null,hist=[];
const flag=id=>localStorage.getItem('dl_'+id)==='1';
function add(c,t){const d=document.createElement('div');d.className='b '+c;d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight;return d}
function render(){
 box.innerHTML='';
 for(const m of MODELS){
  const d=document.createElement('div');d.className='m'+(cur&&cur.id===m.id?' on':'');
  const st=cur&&cur.id===m.id?'✓ hazırdır':loadingId===m.id?'yüklənir...':flag(m.id)?'yüklənib (oflayn)':'yüklə • '+m.size;
  d.innerHTML=`<b>${m.name}</b><small id="s_${m.id}">${st}</small><div class="bar"><i id="p_${m.id}"></i></div>`;
  d.onclick=()=>pick(m);box.append(d);
 }
}
async function pick(m){
 if(busy||(cur&&cur.id===m.id))return;
 const had=flag(m.id);
 if(!had&&!navigator.onLine){add('e',ERR);return}
 busy=true;loadingId=m.id;
 try{if(w){await w.exit()}}catch(e){}
 w=null;cur=null;render();
 try{
  w=new Wllama(CFG);
  await w.loadModelFromUrl(m.url,{n_ctx:2048,allowOffline:true,
   progressCallback:({loaded,total})=>{
    const p=total?Math.round(loaded/total*100):0;
    $('#p_'+m.id).style.width=p+'%';$('#s_'+m.id).textContent=(had?'yüklənir ':'endirilir ')+p+'%';
   }});
  localStorage.setItem('dl_'+m.id,'1');cur=m;hist=[];
  add('a',m.name+' hazırdır.');
 }catch(e){
  w=null;cur=null;
  if(!navigator.onLine){localStorage.removeItem('dl_'+m.id);add('e',ERR)}
  else add('e','Error: '+(e&&e.message||e));
 }
 busy=false;loadingId=null;render();
}
$('form').onsubmit=async ev=>{
 ev.preventDefault();
 const i=$('input'),t=i.value.trim();
 if(!t||busy)return;
 if(!cur){add('e','Əvvəlcə bir model seç.');return}
 i.value='';add('u',t);hist.push({role:'user',content:t});
 if(hist.length>8)hist=hist.slice(-8);
 const b=add('a','...');busy=true;
 try{
  const r=await w.createChatCompletion(hist,{nPredict:512,sampling:{temp:0.7},
   onNewToken:(tk,pc,text)=>{b.textContent=text;chat.scrollTop=chat.scrollHeight}});
  b.textContent=r;hist.push({role:'assistant',content:r});
 }catch(e){b.className='b e';b.textContent='Error: '+(e&&e.message||e)}
 busy=false;
};
render();
</script>
</body></html>
